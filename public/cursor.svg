<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <defs>

    <!-- Main sphere gradient: lit from upper-left -->
    <radialGradient id="ball" cx="34%" cy="27%" r="70%">
      <stop offset="0%"   stop-color="#E8F84E"/>
      <stop offset="28%"  stop-color="#C8E000"/>
      <stop offset="65%"  stop-color="#9CB800"/>
      <stop offset="100%" stop-color="#637600"/>
    </radialGradient>

    <!-- Rim darkening — makes the sphere feel round -->
    <radialGradient id="rim" cx="50%" cy="50%" r="50%">
      <stop offset="58%"  stop-color="black" stop-opacity="0"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.55"/>
    </radialGradient>

    <!-- Gloss specular highlight: top-left -->
    <radialGradient id="gloss" cx="36%" cy="26%" r="38%">
      <stop offset="0%"   stop-color="white" stop-opacity="0.70"/>
      <stop offset="45%"  stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <!-- Secondary soft fill (counterlight on lower-right) -->
    <radialGradient id="fill" cx="72%" cy="76%" r="45%">
      <stop offset="0%"   stop-color="#E2F540" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#E2F540" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip to exact ball circle -->
    <clipPath id="c">
      <circle cx="50" cy="50" r="46.5"/>
    </clipPath>

  </defs>

  <!-- Ground shadow (cast) -->
  <ellipse cx="53" cy="97.5" rx="25" ry="3" fill="black" opacity="0.22"/>

  <!-- Border ring -->
  <circle cx="50" cy="50" r="49" fill="#161E06"/>

  <!-- Ball base -->
  <circle cx="50" cy="50" r="46.5" fill="url(#ball)"/>

  <!--
    SEAM: the real tennis ball seam is a single S-curve (sigmoid) when
    viewed front-on, running from upper-right to lower-left.
    Cubic bezier: start (72,13) → ctrl1 (88,36) → ctrl2 (12,64) → end (28,87).
    Midpoint lands exactly at (50,50).
  -->

  <!-- Seam outer dark line (the groove) -->
  <path d="M 72 13 C 88 36, 12 64, 28 87"
        fill="none"
        stroke="#161E06"
        stroke-width="6.5"
        stroke-linecap="round"
        clip-path="url(#c)"/>

  <!-- Seam left edge micro-highlight (felt edge catch light) -->
  <path d="M 72 13 C 88 36, 12 64, 28 87"
        fill="none"
        stroke="rgba(240,255,100,0.22)"
        stroke-width="2"
        stroke-linecap="round"
        stroke-dasharray="0"
        clip-path="url(#c)"/>

  <!-- Rim darkening over seam so it integrates with depth -->
  <circle cx="50" cy="50" r="46.5" fill="url(#rim)" clip-path="url(#c)"/>

  <!-- Counter-light fill lower-right -->
  <circle cx="50" cy="50" r="46.5" fill="url(#fill)" clip-path="url(#c)"/>

  <!-- Gloss specular -->
  <circle cx="50" cy="50" r="46.5" fill="url(#gloss)" clip-path="url(#c)"/>

</svg>
